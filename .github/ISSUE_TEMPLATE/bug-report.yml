name: Bug report
description: Report a reproducible product defect
title: '[Bug] '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.2.8
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
