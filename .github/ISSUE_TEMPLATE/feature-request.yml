name: Feature request
description: Propose a scoped feature
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Explicit exclusions and protected areas
